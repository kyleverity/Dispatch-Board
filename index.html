<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dispatch Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.1/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.1/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.1/firebase-database-compat.min.js"></script>
<style>
  :root{
    --bg: #12151B;
    --panel: #191E26;
    --panel-2: #1F2530;
    --border: #2A313D;
    --text: #E7EAEF;
    --text-muted: #7C8698;
    --text-dim: #4E5766;
    --amber: #E0A458;
    --amber-dim: rgba(224,164,88,0.14);
    --red: #C1543C;
    --red-dim: rgba(193,84,60,0.14);
    --blue: #5B8DBF;
    --blue-dim: rgba(91,141,191,0.14);
    --green: #5A9E6F;
    --green-dim: rgba(90,158,111,0.14);
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono{ font-family: 'IBM Plex Mono', monospace; }

  #app{
    max-width: 780px;
    margin: 0 auto;
    padding: 36px 20px 80px;
  }

  header.top{
    display:flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 18px;
  }
  header.top h1{
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 4px 0;
    letter-spacing: -0.01em;
  }
  header.top p{
    margin:0;
    color: var(--text-muted);
    font-size: 13.5px;
  }
  .count-badge{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
    text-align: right;
  }
  .count-badge b{ color: var(--text); font-size: 20px; display:block; }
  .sync-status{
    font-size: 11px;
    margin-top: 6px;
    display:flex;
    align-items:center;
    gap:5px;
    justify-content:flex-end;
  }
  .sync-dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--text-dim);
  }
  .sync-status.live .sync-dot{ background: var(--green); }
  .sync-status.offline .sync-dot{ background: var(--red); }
  .signout-link{
    background:none; border:none; cursor:pointer;
    color: var(--text-dim);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px;
    text-decoration: underline;
    padding: 0;
    margin-top: 6px;
  }
  .signout-link:hover{ color: var(--text-muted); }

  section{ margin-bottom: 30px; }
  section h2{
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin: 0 0 12px 0;
    letter-spacing: 0.02em;
  }

  /* Rotation strip */
  .rotation-strip{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .tech-chip{
    display:flex;
    align-items:center;
    gap:6px;
    height: 26px;
    padding: 0 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 12.5px;
    transition: border-color .15s, background .15s;
  }
  .tech-chip .num{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }
  .tech-chip.on-deck{
    border-color: var(--amber);
    background: var(--amber-dim);
  }
  .tech-chip.on-deck .num{ color: var(--amber); }
  .tech-chip.skipped{
    opacity: 0.45;
  }
  .tech-chip.skipped .name{ text-decoration: line-through; }
  .tech-chip button{
    background:none; border:none; cursor:pointer;
    color: var(--text-dim);
    font-size: 12px;
    padding: 2px 4px;
    line-height:1;
  }
  .tech-chip button:hover{ color: var(--text); }
  .tech-chip .toggle-skip{
    font-family: 'IBM Plex Mono', monospace;
  }

  input, select{
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 9px 11px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13.5px;
    outline: none;
  }
  input:focus, select:focus{ border-color: var(--amber); }
  .ticket-row select{
    padding: 3px 6px;
    font-size: 12px;
  }
  input::placeholder{ color: var(--text-dim); }

  button.primary{
    background: var(--amber);
    color: #1A1206;
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
  }
  button.primary:hover{ filter: brightness(1.08); }
  button.primary:disabled{
    background: var(--panel-2);
    color: var(--text-dim);
    cursor: not-allowed;
  }
  button.ghost{
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 6px;
    padding: 9px 14px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13.5px;
    cursor:pointer;
  }
  button.ghost:hover{ color: var(--text); border-color: var(--text-dim); }

  /* New ticket form */
  .ticket-form{
    display:flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .ticket-form input[type=text]{ flex: 1; min-width: 200px; }

  /* Ticket list */
  .ticket-row{
    display:grid;
    grid-template-columns: 62px 1fr auto auto 28px;
    align-items:center;
    gap: 12px;
    padding: 4px 4px;
    border-bottom: 1px solid var(--border);
    font-size: 12.5px;
  }
  .ticket-row:first-of-type{ border-top: 1px solid var(--border); }
  .ticket-id{
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text-dim);
    font-size: 12px;
  }
  .ticket-title{ min-width:0; }
  .ticket-title .t{
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ticket-title .meta{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--text-dim);
    margin-top: 1px;
  }
  .priority-tag{
    font-size: 10px;
    font-weight: 500;
    padding: 1px 6px;
    border-radius: 4px;
    white-space: nowrap;
    font-family: 'IBM Plex Mono', monospace;
  }
  .priority-Low{ color: var(--text-muted); background: var(--panel-2); }
  .priority-Normal{ color: var(--blue); background: var(--blue-dim); }
  .priority-High{ color: var(--amber); background: var(--amber-dim); }
  .priority-Urgent{ color: var(--red); background: var(--red-dim); }

  .assigned-to{
    color: var(--text-muted);
    white-space: nowrap;
    font-size: 13px;
  }
  .del-btn{
    background:none; border:none; cursor:pointer;
    color: var(--text-dim);
    font-size: 16px;
    padding: 2px;
  }
  .del-btn:hover{ color: var(--red); }

  .empty-state{
    padding: 30px 4px;
    color: var(--text-dim);
    font-size: 13.5px;
    border-top: 1px solid var(--border);
  }

  .loading{
    padding: 60px 20px;
    text-align:center;
    color: var(--text-muted);
    font-size: 13.5px;
  }

  /* Login screen */
  .login-wrap{
    max-width: 360px;
    margin: 90px auto 0;
    padding: 0 20px;
  }
  .login-wrap h1{
    font-size: 24px;
    margin: 0 0 6px 0;
  }
  .login-wrap p{
    color: var(--text-muted);
    font-size: 13.5px;
    margin: 0 0 24px 0;
  }
  .login-form{
    display:flex;
    flex-direction: column;
    gap: 10px;
  }
  .login-form input{ width: 100%; }
  .login-form button{ width: 100%; margin-top: 4px; }
  .login-error{
    color: var(--red);
    font-size: 12.5px;
    margin-top: 4px;
    min-height: 16px;
  }

  .board-group{ margin-bottom: 42px; }
  .board-group:last-child{ margin-bottom: 30px; }
  .board-title{
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text);
    padding-left: 11px;
    border-left: 3px solid var(--amber);
    margin-bottom: 20px;
  }
  .board-count{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 400;
    margin-left: 8px;
  }

  @media (max-width: 560px){
    .ticket-row{
      grid-template-columns: 1fr;
      row-gap: 6px;
    }
    .ticket-id{ order: -1; }
  }
</style>
</head>
<body>
<div id="app"><div class="loading">Connecting to the dispatch board…</div></div>

<script>
/* ---------- Firebase setup ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyBlp-SsWSfVik4Mnix-ifFDkaiswr2pCik",
  authDomain: "dispatch-rotation-tracker.firebaseapp.com",
  databaseURL: "https://dispatch-rotation-tracker-default-rtdb.firebaseio.com",
  projectId: "dispatch-rotation-tracker",
  storageBucket: "dispatch-rotation-tracker.firebasestorage.app",
  messagingSenderId: "832135101384",
  appId: "1:832135101384:web:8f9e8fca1a8d8822ec5efd"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
let appStarted = false;
let isLive = false;

/* ---------- Board definitions ----------
   Help Desk keeps its original (unprefixed) paths for backward compatibility
   with data that already exists. Intake uses its own paths alongside it,
   nested under the same "dispatch" node so the existing security rules
   (which already scope to /dispatch) automatically cover it too. */
const BOARD_DEFS = [
  { key: 'helpdesk', label: 'Help Desk', techsPath: 'dispatch/techs', ticketsPath: 'dispatch/tickets', metaPath: 'dispatch/meta', seededPath: 'dispatch/seeded', defaultNames: ['Andy', 'Brian', 'Andrew', 'Arpita', 'Chris'] },
  { key: 'intake', label: 'Intake', techsPath: 'dispatch/intakeTechs', ticketsPath: 'dispatch/intakeTickets', metaPath: 'dispatch/intakeMeta', seededPath: 'dispatch/intakeSeeded', defaultNames: ['Ian', 'Kevin', 'Sean', 'Chalcie'] }
];

const boards = {};
BOARD_DEFS.forEach(def => {
  boards[def.key] = Object.assign({}, def, {
    techs: {}, tickets: {},
    meta: { nextTechId: null, nextTicketNum: 1, lastResetDate: '' },
    gotTechs: false, gotTickets: false, gotMeta: false
  });
});

function todayKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

/* ---------- Auth gate ---------- */
auth.onAuthStateChanged(user => {
  if(user){
    renderLoading();
    if(!appStarted){
      appStarted = true;
      startApp();
    }
  } else {
    renderLogin();
  }
});

function renderLoading(){
  document.getElementById('app').innerHTML = '<div class="loading">Connecting to the dispatch board…</div>';
}

function renderLogin(errorMsg){
  document.getElementById('app').innerHTML = `
    <div class="login-wrap">
      <h1>Dispatch Tracker</h1>
      <p>Sign in with the team login to view and update the board.</p>
      <div class="login-form">
        <input type="email" id="login-email" placeholder="Email" autocomplete="username" />
        <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" />
        <button class="primary" id="login-btn">Sign in</button>
        <div class="login-error">${errorMsg ? escapeHtml(errorMsg) : ''}</div>
      </div>
    </div>
  `;
  const doLogin = () => {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if(!email || !password) return;
    auth.signInWithEmailAndPassword(email, password).catch(err => {
      renderLogin('Wrong email or password — try again.');
    });
  };
  document.getElementById('login-btn').onclick = doLogin;
  document.getElementById('login-password').onkeydown = (e) => { if(e.key === 'Enter') doLogin(); };
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/* ---------- Everything below only runs once someone is signed in ---------- */
function startApp(){

  BOARD_DEFS.forEach(def => seedBoard(boards[def.key]));
  BOARD_DEFS.forEach(def => attachListeners(boards[def.key]));

  db.ref('.info/connected').on('value', snap => {
    isLive = snap.val() === true;
    maybeRender();
  });

  /* Safety-net full refresh every 2 minutes, in case a connection silently drops.
     Live changes already appear instantly via the Firebase listeners below. */
  setInterval(() => location.reload(), 2 * 60 * 1000);
}

function seedBoard(board){
  const seededRef = db.ref(board.seededPath);
  seededRef.transaction(current => current ? undefined : true, (err, committed) => {
    if(!err && committed){
      const techsRef = db.ref(board.techsPath);
      const updates = {};
      const keys = board.defaultNames.map(() => techsRef.push().key);
      board.defaultNames.forEach((name, i) => {
        updates[board.techsPath + '/' + keys[i]] = { name, active: true, order: i };
      });
      updates[board.metaPath] = { nextTechId: keys[0], nextTicketNum: 1, lastResetDate: todayKey() };
      db.ref().update(updates);
    }
  });
}

function attachListeners(board){
  db.ref(board.techsPath).on('value', snap => {
    board.techs = snap.val() || {};
    board.gotTechs = true;
    maybeRender();
  });
  db.ref(board.ticketsPath).on('value', snap => {
    board.tickets = snap.val() || {};
    board.gotTickets = true;
    maybeRender();
  });
  db.ref(board.metaPath).on('value', snap => {
    board.meta = snap.val() || board.meta;
    board.gotMeta = true;
    checkAutoReset(board);
    maybeRender();
  });
}

function maybeRender(){
  const allReady = Object.values(boards).every(b => b.gotTechs && b.gotTickets && b.gotMeta);
  if(allReady) render();
}

/* ---------- Helpers ---------- */
function activeTechEntries(board){
  return Object.entries(board.techs)
    .filter(([, t]) => t.active)
    .sort((a, b) => (a[1].order || 0) - (b[1].order || 0));
}
function allTechEntriesSorted(board){
  return Object.entries(board.techs).sort((a, b) => (a[1].order || 0) - (b[1].order || 0));
}
function ticketEntriesSorted(board){
  return Object.entries(board.tickets).sort((a, b) => (b[1].num || 0) - (a[1].num || 0));
}
function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric'}) + ' · ' +
         d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit'});
}
function pad(n){ return '#' + String(n).padStart(4,'0'); }
function firstTechId(board){
  const sorted = allTechEntriesSorted(board);
  return sorted.length ? sorted[0][0] : null;
}

/* ---------- Mutations (write straight to Firebase; the listener re-renders everyone) ---------- */
function toggleTechActive(board, id){
  const t = board.techs[id];
  if(!t) return;
  const newActive = !t.active;
  const updates = {};
  updates[board.techsPath + '/' + id + '/active'] = newActive;
  if(!newActive && board.meta.nextTechId === id){
    const remaining = activeTechEntries(board).filter(([k]) => k !== id);
    updates[board.metaPath + '/nextTechId'] = remaining.length ? remaining[0][0] : null;
  }
  db.ref().update(updates);
}

function addTicket(board, title, priority, assigneeId){
  title = title.trim();
  if(!title) return;
  const ticketsRef = db.ref(board.ticketsPath);
  const metaRef = db.ref(board.metaPath);

  if(assigneeId){
    const tech = board.techs[assigneeId];
    if(!tech) return;
    let ticketNum = 1;
    metaRef.transaction(current => {
      if(!current) current = { nextTechId: null, nextTicketNum: 1, lastResetDate: todayKey() };
      ticketNum = current.nextTicketNum || 1;
      return Object.assign({}, current, { nextTicketNum: ticketNum + 1 });
    }, (error, committed) => {
      if(error || !committed) return;
      const ticketKey = ticketsRef.push().key;
      ticketsRef.child(ticketKey).set({
        num: ticketNum,
        title,
        priority,
        assignedToId: assigneeId,
        assignedToName: tech.name,
        createdAt: new Date().toISOString()
      });
    });
    return;
  }

  const active = activeTechEntries(board);
  if(active.length === 0) return;

  let assignedId = null, assignedName = 'Unassigned', ticketNum = 1;

  metaRef.transaction(current => {
    if(!current) current = { nextTechId: null, nextTicketNum: 1, lastResetDate: todayKey() };
    let idx = active.findIndex(([k]) => k === current.nextTechId);
    if(idx === -1) idx = 0;
    assignedId = active[idx][0];
    assignedName = active[idx][1].name;
    ticketNum = current.nextTicketNum || 1;
    const nextIdx = (idx + 1) % active.length;
    return {
      nextTechId: active[nextIdx][0],
      nextTicketNum: ticketNum + 1,
      lastResetDate: current.lastResetDate || todayKey()
    };
  }, (error, committed) => {
    if(error || !committed) return;
    const ticketKey = ticketsRef.push().key;
    ticketsRef.child(ticketKey).set({
      num: ticketNum,
      title,
      priority,
      assignedToId: assignedId,
      assignedToName: assignedName,
      createdAt: new Date().toISOString()
    });
  });
}

function reassignTicket(board, ticketId, techId){
  const tech = board.techs[techId];
  db.ref(board.ticketsPath).child(ticketId).update({
    assignedToId: techId || null,
    assignedToName: tech ? tech.name : 'Unassigned'
  });
}

function deleteTicket(board, ticketId){
  db.ref(board.ticketsPath).child(ticketId).remove();
}

function resetTickets(board){
  const typed = prompt(`This clears all ${board.label} tickets for everyone and resets that rotation back to the top.\n\nType RESET to confirm:`);
  if(!typed || typed.trim().toUpperCase() !== 'RESET') return;
  const updates = {};
  updates[board.ticketsPath] = null;
  updates[board.metaPath + '/nextTicketNum'] = 1;
  updates[board.metaPath + '/lastResetDate'] = todayKey();
  updates[board.metaPath + '/nextTechId'] = firstTechId(board);
  db.ref().update(updates);
}

function checkAutoReset(board){
  const today = todayKey();
  if(board.meta.lastResetDate && board.meta.lastResetDate !== today){
    const updates = {};
    updates[board.ticketsPath] = null;
    updates[board.metaPath + '/nextTicketNum'] = 1;
    updates[board.metaPath + '/lastResetDate'] = today;
    updates[board.metaPath + '/nextTechId'] = firstTechId(board);
    db.ref().update(updates);
  }
}

/* ---------- Render ---------- */
function renderBoardSection(board){
  const ticketList = ticketEntriesSorted(board);
  const techList = allTechEntriesSorted(board);
  const key = board.key;

  const rotationHtml = techList.length
    ? techList.map(([id, t], i) => {
        const isOnDeck = id === board.meta.nextTechId && t.active;
        return `
          <div class="tech-chip ${isOnDeck ? 'on-deck' : ''} ${!t.active ? 'skipped' : ''}">
            <span class="num">${i+1}</span>
            <span class="name">${escapeHtml(t.name)}</span>
            <button class="toggle-skip" data-action="toggle-tech" data-board="${key}" data-id="${id}" title="${t.active ? 'Mark unavailable' : 'Mark available'}">${t.active ? '⏸' : '▶'}</button>
          </div>`;
      }).join('')
    : '<div style="color:var(--text-dim); font-size:13.5px;">No techs yet.</div>';

  const ticketsHtml = ticketList.length
    ? ticketList.map(([id, ticket]) => `
        <div class="ticket-row">
          <div class="ticket-id mono">${pad(ticket.num)}</div>
          <div class="ticket-title">
            <div class="t">${escapeHtml(ticket.title)}</div>
            <div class="meta">${fmtTime(ticket.createdAt)}</div>
          </div>
          <div class="priority-tag priority-${ticket.priority}">${ticket.priority}</div>
          <select data-action="reassign" data-board="${key}" data-id="${id}" title="Reassign">
            <option value="">Unassigned</option>
            ${techList.map(([tid, t]) => `<option value="${tid}" ${tid === ticket.assignedToId ? 'selected' : ''}>${escapeHtml(t.name)}</option>`).join('')}
          </select>
          <button class="del-btn" data-action="delete-ticket" data-board="${key}" data-id="${id}" title="Delete">✕</button>
        </div>
      `).join('')
    : '<div class="empty-state">No tickets dispatched yet.</div>';

  return `
    <div class="board-group">
      <div class="board-title">${escapeHtml(board.label)}<span class="board-count">${ticketList.length} ticket${ticketList.length === 1 ? '' : 's'}</span></div>

      <section>
        <h2>ROTATION</h2>
        <div class="rotation-strip">${rotationHtml}</div>
      </section>

      <section>
        <h2>NEW TICKET</h2>
        <div class="ticket-form">
          <input type="text" id="new-ticket-title-${key}" placeholder="What needs doing?" />
          <select id="new-ticket-priority-${key}">
            <option>Normal</option>
            <option>Low</option>
            <option>High</option>
            <option>Urgent</option>
          </select>
          <select id="new-ticket-assignee-${key}" title="Who gets this ticket">
            <option value="">Next in rotation</option>
            ${activeTechEntries(board).map(([id, t]) => `<option value="${id}">${escapeHtml(t.name)}</option>`).join('')}
          </select>
          <button class="primary" data-action="add-ticket" data-board="${key}" ${activeTechEntries(board).length === 0 ? 'disabled' : ''}>Dispatch</button>
        </div>
        ${activeTechEntries(board).length === 0 ? '<div style="color:var(--text-dim); font-size:12.5px; margin-top:8px;">Add at least one available tech to dispatch a ticket.</div>' : ''}
      </section>

      <section>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
          <h2 style="margin:0;">TICKETS</h2>
          <button class="ghost" data-action="reset-tickets" data-board="${key}">Reset now</button>
        </div>
        <div style="color:var(--text-dim); font-size:12px; margin-bottom:12px;">Resets automatically at midnight, rotation back to the top.</div>
        ${ticketsHtml}
      </section>
    </div>
  `;
}

function render(){
  const app = document.getElementById('app');
  const totalTickets = Object.values(boards).reduce((sum, b) => sum + ticketEntriesSorted(b).length, 0);

  app.innerHTML = `
    <header class="top">
      <div>
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:4px;">
          <img src="https://verityit.com/wp-content/uploads/2020/04/VerITy_Favicon.png" alt="Verity IT" style="width:26px; height:26px; object-fit:contain; border-radius:5px;" />
          <h1 style="margin:0;">Dispatch Tracker</h1>
        </div>
        <p>Tickets route to whoever is on deck, in order. Shared live with everyone on this link.</p>
      </div>
      <div class="count-badge">
        <b>${totalTickets}</b>tickets
        <div class="sync-status ${isLive ? 'live' : 'offline'}"><span class="sync-dot"></span>${isLive ? 'synced' : 'reconnecting…'}</div>
        <button class="signout-link" data-action="sign-out">Sign out</button>
      </div>
    </header>

    ${renderBoardSection(boards.helpdesk)}
    ${renderBoardSection(boards.intake)}
  `;

  wireEvents();
}

function wireEvents(){
  const app = document.getElementById('app');

  BOARD_DEFS.forEach(def => {
    const board = boards[def.key];
    const key = def.key;

    const addBtn = app.querySelector(`[data-action="add-ticket"][data-board="${key}"]`);
    if(addBtn){
      addBtn.onclick = () => {
        const titleInput = document.getElementById(`new-ticket-title-${key}`);
        const prioritySelect = document.getElementById(`new-ticket-priority-${key}`);
        const assigneeSelect = document.getElementById(`new-ticket-assignee-${key}`);
        addTicket(board, titleInput.value, prioritySelect.value, assigneeSelect.value);
        titleInput.value = '';
        prioritySelect.value = 'Normal';
        assigneeSelect.value = '';
      };
    }
    const titleInput = document.getElementById(`new-ticket-title-${key}`);
    if(titleInput){
      titleInput.onkeydown = (e) => {
        if(e.key === 'Enter'){
          const prioritySelect = document.getElementById(`new-ticket-priority-${key}`);
          const assigneeSelect = document.getElementById(`new-ticket-assignee-${key}`);
          addTicket(board, titleInput.value, prioritySelect.value, assigneeSelect.value);
          titleInput.value = '';
          prioritySelect.value = 'Normal';
          assigneeSelect.value = '';
        }
      };
    }
  });

  app.querySelectorAll('[data-action="toggle-tech"]').forEach(btn => {
    btn.onclick = () => toggleTechActive(boards[btn.dataset.board], btn.dataset.id);
  });
  app.querySelectorAll('[data-action="reassign"]').forEach(sel => {
    sel.onchange = () => reassignTicket(boards[sel.dataset.board], sel.dataset.id, sel.value);
  });
  app.querySelectorAll('[data-action="delete-ticket"]').forEach(btn => {
    btn.onclick = () => deleteTicket(boards[btn.dataset.board], btn.dataset.id);
  });
  app.querySelectorAll('[data-action="reset-tickets"]').forEach(btn => {
    btn.onclick = () => resetTickets(boards[btn.dataset.board]);
  });
  const signOutBtn = app.querySelector('[data-action="sign-out"]');
  if(signOutBtn){
    signOutBtn.onclick = () => { auth.signOut().then(() => location.reload()); };
  }
}
</script>
</body>
</html>
