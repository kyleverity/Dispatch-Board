name: Nightly Dispatch Report

on:
  # No GitHub schedule on purpose: GitHub drops or delays scheduled runs, so an outside
  # timer (cron-job.org) starts this workflow on time via workflow_dispatch instead.
  # The script checks the real Eastern clock and does nothing outside its windows.
  workflow_dispatch:
    inputs:
      force:
        description: 'Send the report right now regardless of time (for testing)'
        type: boolean
        default: false
      force_pause:
        description: 'Apply the scheduled pauses right now regardless of time (for testing)'
        type: boolean
        default: false
      mode:
        description: 'Which report to run (leave on nightly except for the weekly / monthly timers)'
        type: choice
        options:
          - nightly
          - weekly
          - monthly
        default: nightly
      no_pie:
        description: 'Leave the pie chart image out of the report (use if a mail filter blocks it)'
        type: boolean
        default: false

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Send report
        working-directory: scripts
        env:
          DISPATCH_EMAIL: ${{ secrets.DISPATCH_EMAIL }}
          DISPATCH_PASSWORD: ${{ secrets.DISPATCH_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FORCE_SEND: ${{ github.event.inputs.force }}
          FORCE_PAUSE: ${{ github.event.inputs.force_pause }}
          DISABLE_PIE: ${{ github.event.inputs.no_pie }}
          REPORT_MODE: ${{ github.event.inputs.mode }}
        run: node send-report.js
